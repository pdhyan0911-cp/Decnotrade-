name: Decnotrade checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-smoke-test:
    name: Static site smoke tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check JavaScript syntax
        run: |
          node --check script.js
          node --check sw.js
          node --check tests/smoke-test.js
      - name: Run Decnotrade smoke tests
        run: node tests/smoke-test.js
